name: Bug in a script or an instruction
description: A script gave a wrong result, crashed, or an instruction sent the agent the wrong way.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [cost.mjs, fingerprint.mjs, media-meta.mjs, glb-inspect.mjs, terms.mjs, claims-check.mjs, report.mjs, stack-scan.js, SKILL.md or a reference]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or request
      description: The exact command, or what you asked the agent. Remove anything private.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What it should have shown, what it showed, and how you know (ffprobe, the vendor's docs, a hand calculation).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version, OS, agent
      placeholder: Node 22.11, macOS 15, Claude Code
  - type: markdown
    attributes:
      value: Please don't attach keys, tokens, account data or files you aren't allowed to share. A small synthetic file that shows the problem is the best fixture.
