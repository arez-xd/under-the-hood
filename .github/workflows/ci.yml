name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check of every script
        run: for f in skills/under-the-hood/scripts/*.mjs skills/under-the-hood/scripts/*.js; do node --check "$f"; done
      - name: Tests
        run: node --test tests/*.test.mjs
